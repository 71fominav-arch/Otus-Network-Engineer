version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SW4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
spanning-tree mode mst
spanning-tree extend system-id
!
spanning-tree mst configuration
 name Moscow
 revision 1
 instance 1 vlan 11, 17, 100
!
spanning-tree mst 1 priority 16384
spanning-tree vlan 1-4094 priority 24576
!
vlan internal allocation policy ascending
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.250.4.250 255.255.255.255
!
interface Port-channel1
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 spanning-tree cost 80
!
interface Ethernet0/0
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/2
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 spanning-tree cost 80
!
interface Ethernet0/3
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 spanning-tree cost 80
!
interface Ethernet1/0
 description to_R12
 switchport access vlan 101
!
interface Ethernet1/1
 switchport access vlan 102
!
interface Ethernet1/2
!
interface Ethernet1/3
!
interface Vlan11
 description to_VPC1
 ip address 10.128.0.2 255.255.255.0
 standby 11 ip 10.128.0.1
 standby 11 priority 140
!
interface Vlan17
 description to_VPC7
 ip address 10.128.1.2 255.255.255.0
 standby 17 ip 10.128.1.1
 standby 17 priority 140
!
interface Vlan100
 ip address 10.0.0.4 255.255.255.240
!
interface Vlan101
 ip address 10.0.0.17 255.255.255.252
!
interface Vlan102
 ip address 10.0.0.21 255.255.255.252
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
!
end

SW4#
