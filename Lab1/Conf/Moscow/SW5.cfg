version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SW5
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
spanning-tree mode mst
spanning-tree extend system-id
!
spanning-tree mst configuration
 name Moscow
 revision 1
 instance 1 vlan 11, 17, 100
!
spanning-tree mst 1 priority 20480
spanning-tree vlan 1-4094 priority 28672
!
vlan internal allocation policy ascending
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.250.5.250 255.255.255.255
!
interface Port-channel1
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 spanning-tree cost 80
!
interface Ethernet0/0
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/2
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 spanning-tree cost 80
!
interface Ethernet0/3
 switchport trunk allowed vlan 11,17,100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 spanning-tree cost 80
!
interface Ethernet1/0
 switchport access vlan 103
!
interface Ethernet1/1
 switchport access vlan 104
!
interface Ethernet1/2
!
interface Ethernet1/3
!
interface Vlan11
 description to_VPC1
 ip address 10.128.0.3 255.255.255.0
 standby 11 ip 10.128.0.1
 standby 11 priority 90
!
interface Vlan17
 description to_VPC7
 ip address 10.128.1.3 255.255.255.0
 standby 17 ip 10.128.1.1
 standby 17 priority 90
!
interface Vlan100
 ip address 10.0.0.5 255.255.255.240
!
interface Vlan103
 description to_R13
 ip address 10.0.0.29 255.255.255.252
!
interface Vlan104
 description to_R12
 ip address 10.0.0.25 255.255.255.252
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
!
end

SW5#
